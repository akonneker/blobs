[package]
name = "blob_game"
version = "0.1.0"
edition = "2024"


[dependencies]
blob_interface = { path = "../blob_interface" }
blob_engine = { path = "../blob_engine" }
extism = "1.4.1"
extism-manifest = "1.11.1"
wasmtime = { version = "30.0.2", features = ["pooling-allocator"] }
rand = "0.9.1"
clap = { version = "4.5.39", features = ["derive"] }
libnoise = "1.2.0"
random = "0.14.0"
probability = "0.20.3"
toml = "0.8.22"
serde = { version = "1.0.219", features = ["derive"] }
image = "0.25.4"
egui = {version= "0.31.1"}
eframe = "0.31.1"
egui_extras = {version="0.31.1", features = ["default", "image"] }
env_logger = "0.11.8"
bincode = "1.3.3"
flate2 = "1.0.35"
rayon = "1.10"
smallvec = "1.15"

[dev-dependencies]
wat = "1"
