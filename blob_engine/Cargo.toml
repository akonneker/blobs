[package]
name = "blob_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
blob_interface = { path = "../blob_interface" }
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.9"
rayon = "1.10"
ring = "0.17.14"
wasmparser = "0.224.1"
