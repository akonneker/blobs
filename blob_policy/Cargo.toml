[package]
name = "blob_policy"
version = "0.1.0"
edition = "2021"

[dependencies]
blob_interface = { path = "../blob_interface" }
libm = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
sha2 = "0.10"
serde_json = "1"
extism-pdk = { version = "1.4.1", default-features = false }

[[example]]
name = "sampled_target_canary"
crate-type = ["cdylib"]
