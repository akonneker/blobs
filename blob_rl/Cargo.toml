[package]
name = "blob_rl"
version = "0.1.0"
edition = "2021"

[dependencies]
blob_interface = { path = "../blob_interface" }
blob_engine = { path = "../blob_engine" }
simple_mind = { path = "../minds/simple_mind" }
aggressive_mind = { path = "../minds/aggressive_mind" }
defensive_mind = { path = "../minds/defensive_mind" }
explorer_mind = { path = "../minds/explorer_mind" }
colony_mind = { path = "../minds/colony_mind" }
burn = { version = "0.20", features = ["autodiff", "train"] }
rayon = "1.10"
rand = "0.9"
rand_chacha = { version = "0.9", features = ["serde"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[features]
default = ["wgpu"]
wgpu = ["burn/wgpu"]
ndarray = ["burn/ndarray"]

[dev-dependencies]
burn = { version = "0.20", features = ["ndarray"] }
tempfile = "3"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "rules-sweep"
path = "src/bin/rules_sweep.rs"

[[bin]]
name = "rules-sweep-run"
path = "src/bin/rules_sweep_run.rs"

