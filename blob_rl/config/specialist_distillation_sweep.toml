# Paired replicated test of stage-local frontier distillation. Both variants
# share the same frequent four-stage cadence, initial-policy provenance, PPO,
# held-out seeds, physics, rewards, and 524,288-quanta-per-environment budget.
# Only the host-side specialist teacher mechanism differs.

base_config = "competitive_transfer_large_skirmish_frequent.toml"
output_dir = "../../sweeps/specialist-distillation-v1"
seeds = [42, 43, 44]

[[variants]]
name = "control"
description = "Frequent curriculum with only the verified initial-policy anchor"

[[variants]]
name = "specialist-distillation"
description = "Qualified ecology/combat frontier teachers at coefficient 0.10"
[variants.specialist_distillation]
enabled = true
ecology_coeff = 0.10
combat_coeff = 0.10
