# blob_rl training configuration

# Training settings
num_envs = 16
rollout_length = 128
total_timesteps = 1_000_000
eval_interval = 50
checkpoint_interval = 100
checkpoint_dir = "./checkpoints"

# PPO hyperparameters
[ppo]
clip_epsilon = 0.2
gamma = 0.99
gae_lambda = 0.95
epochs_per_update = 4
minibatch_size = 64
learning_rate = 3e-4
entropy_coeff = 0.01
value_loss_coeff = 0.5
max_grad_norm = 0.5

# Neural network architecture
[model]
hidden1 = 128
hidden2 = 64

# Environment settings
[env]
world_size = 64
cells_per_team = 12
max_episode_len = 1000
num_teams = 2

# Reward shaping
[reward]
survive_tick = 0.01
eat_energy = 0.002
kill_enemy = 1.0
cell_died = -1.0
split_success = 2.0
team_wins = 10.0
team_loses = -10.0

# Self-play settings
[self_play]
start_after_timesteps = 500_000
opponent_update_interval = 50
max_opponent_pool = 10
