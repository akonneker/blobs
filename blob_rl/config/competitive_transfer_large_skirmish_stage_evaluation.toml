# Four-cadence combat-retention profile with competency evaluations tied to
# simulation time rather than PPO update count. Each cycle captures the policy
# after the contact and skirmish rehearsal windows. Every capture publishes an
# immutable checkpoint; the terminal boundary supplies the final measurement.

seed = 42
num_envs = 4
rollout_length = 64
total_timesteps = 200_000
total_simulation_quanta_per_env = 524_288
eval_interval = 0
eval_episodes = 8
evaluation_opponents = ["wait", "random", "aggressive"]
evaluation_snapshots = []
evaluation_seed = 1_000_000_000
checkpoint_interval = 0
checkpoint_dir = "./checkpoints/competitive-transfer-large-skirmish-stage-evaluation"

[feeding_curriculum]
enabled = true
rollout_stages_enabled = false
on_food_until_sim_time_quanta_per_env = 524_288
adjacent_food_until_sim_time_quanta_per_env = 1_572_864

[feeding_curriculum.promotion]
min_on_food_episode_success_rate = 0.95
min_adjacent_episode_success_rate = 0.80
min_survival_rate = 0.80
min_consumed_energy_per_initial_cell = 1.0
evaluation_max_episode_len = 4096
evaluation_sim_time_limit_quanta = 65_536

[combat_curriculum]
enabled = true
cycle_sim_time_quanta_per_env = 131_072
on_food_sim_time_quanta_per_cycle = 16_384
adjacent_food_sim_time_quanta_per_cycle = 16_384
contact_sim_time_quanta_per_cycle = 32_768
skirmish_sim_time_quanta_per_cycle = 32_768
competency_evaluation_frontiers_sim_time_quanta_per_cycle = [65_536, 98_304]
retention_episode_sim_time_limit_quanta = 16_384
contact_episode_sim_time_limit_quanta = 16_384
skirmish_episode_sim_time_limit_quanta = 32_768
contact_evaluation_sim_time_limit_quanta = 16_384
skirmish_evaluation_sim_time_limit_quanta = 32_768
contact_action_kind_exploration_floor = 0.50
skirmish_action_kind_exploration_floor = 0.25
