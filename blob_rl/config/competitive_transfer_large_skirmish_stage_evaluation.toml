epochs_per_update = 4
minibatch_size = 128
recurrent_unroll_steps = 16
learning_rate = 1e-5
entropy_coeff = 0.01
action_kind_exploration_floor = 0.10
value_loss_coeff = 0.5
max_grad_norm = 0.5
target_kl = 0.03
initial_policy_anchor_coeff = 0.25

[model]
