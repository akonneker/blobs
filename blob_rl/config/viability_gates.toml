# Starter pre-training gates for the documented three-seed viability matrix.
# These are explicit exploratory thresholds, not permanent game-balance goals.
schema_version = 2

[geometry]
# These checks are independent of which baseline Minds happen to be selected.
# Every founder must have a movement path to a plant, and the p90 plant route
# for every team must fit inside the best measured no-food travel endurance.
require_all_starting_cells_can_reach_plants = true
require_team_p90_within_best_travel_endurance = true
# Ordinary symmetric sweep variants should not create a large team-specific
# access advantage. Deliberate asymmetry should use a separate policy below.
max_team_mean_plant_distance_gap = 4.0
max_team_p90_plant_distance_gap = 6.0
max_exclusive_plant_share_gap = 0.25
max_exclusive_major_food_share_gap = 0.25
max_starting_plant_occupancy_rate_gap = 0.10

[absolute]
# Timeouts are retained as a separate result rather than silently scored as a
# loss. This initial bound permits one of three seeds to time out.
max_timeout_rate = 0.34
# Non-attacking profiles should not eliminate each other through upkeep alone
# during the configured horizon.
max_extinction_without_combat_rate = 0.0
# Native baseline profiles do not excavate, so tracked non-terrain mass-energy
# should remain exact from episode start to finish.
max_mass_energy_drift_episode_rate = 0.0
min_candidate_survival_rate = 0.66
# When either profile can attack, require evidence that the combat rules are
# reachable rather than merely enabled in the action catalog.
min_attack_commits_per_episode_for_combat_profiles = 0.1
min_applied_damage_per_episode_for_combat_profiles = 0.1
max_commit_rejection_rate = 0.05
max_frustrated_resolution_rate = 0.50

[paired]
# With three paired seeds, tolerate at most one ordinal outcome regression.
max_regressed_outcome_rate = 0.34
max_candidate_win_rate_drop = 0.34
max_final_candidate_cell_mean_drop = 1.0
max_timeout_rate_increase = 0.34
