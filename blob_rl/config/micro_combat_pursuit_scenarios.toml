# Strict observation-only pursuit controls. These are feasibility probes, not
# yet part of the training or checkpoint-promotion suite.

schema_version = 1

[[scenarios]]
name = "one-v-one-pursuer-survival"
objective = "survival"
world_size = 7
training_cells = 1
opponent_cells = 1
training_initial_energy = 100
opponent_initial_energy = 100
starting_layout = "paired_contact"
opponent = "pursuer"
sim_time_limit_quanta = 8192

