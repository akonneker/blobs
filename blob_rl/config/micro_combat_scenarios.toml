# Small, local held-out scenarios. These labels and objectives remain host-side
# evaluation metadata and are never projected into a Mind observation.

schema_version = 1

[[scenarios]]
name = "one-v-one-aggressor-survival"
objective = "survival"
world_size = 7
training_cells = 1
opponent_cells = 1
training_initial_energy = 100
opponent_initial_energy = 100
starting_layout = "paired_contact"
opponent = "aggressive"
sim_time_limit_quanta = 8192

