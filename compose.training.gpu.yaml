services:
  trainer-gpu:
    image: ${TRAINING_GPU_IMAGE:-blobs-training:gpu-local}
    build:
      context: .
      dockerfile: Dockerfile.training
      target: gpu
      args:
        BLOB_CODE_REVISION: ${BLOB_CODE_REVISION:-unversioned-container}
    init: true
    gpus: all
    user: "${TRAINING_UID:-10001}:${TRAINING_GID:-10001}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      WGPU_BACKEND: vulkan
      WGPU_POWER_PREF: high
      RAYON_NUM_THREADS: ${TRAINING_THREADS:-8}
      RUST_BACKTRACE: "1"
      HOME: /tmp
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    tmpfs:
      - /tmp:size=1g,mode=1777
    volumes:
      - ./blob_rl/config:/config:ro
      - ${TRAINING_OUTPUT_DIR:-./training-output-gpu}:/output
      - blobs-gpu-kernel-cache:/cache
    command:
      - train
      - --config
      - /config/${TRAINING_CONFIG:-default.toml}
      - --checkpoint-dir
      - /output/checkpoints
      - --save-model
      - /output/final-model

volumes:
  blobs-gpu-kernel-cache:
