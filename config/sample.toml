# Sample configuration for Cells Redux

[general]
# Maximum number of iterations for the game simulation.
# If commented out or not present, a default value will be used (currently 1048576).
# max_iterations = 1000000

# Seed for random number generation.
# If commented out or not present, the game will not be seeded (or use a default seed if implemented).
# seed = 42

[world]
# World dimensions
width = 50
height = 30

# Type of terrain to generate. Options: "flat", "noise"
terrain_type = "noise"

# Number of discrete elevation levels for the terrain.
# More levels mean more varied terrain height.
terrain_levels = 5    # Number of distinct elevation levels for noise terrain

[world.energy_options]
# Configuration for energy sources in the world.

# Number of scattered energy sources (e.g., loose energy packets)
num_scattered = 100

# Number of energy-generating plants
num_plants = 20

# Energy distribution for scattered sources.
# Options:
# Constant = <value>
# Uniform = { min = <value>, max = <value> }
# PseudoNormal = { mean = <value>, std_dev = <value> } (Values are clamped at 0)
# Binomial = { n = <value>, p = <value> } (N trials, P probability of success for each)
scattered_energy = { Constant = 25 }
# Example: scattered_energy = { Uniform = { min = 20, max = 80 } }
# Example: scattered_energy = { PseudoNormal = { mean = 50, std_dev = 15 } }
# Example: scattered_energy = { Binomial = { n = 100, p = 0.5 } } # Results in ~50 energy

# Energy generation rate for plants
plant_rate = { Uniform = [1, 5] }

# Initial energy for plants when they are created
plant_current_energy = { Uniform = [10, 30] }
# Example: plant_current_energy = { PseudoNormal = { mean = 80, std_dev = 20 } }

# Maximum energy capacity for plants
plant_max_energy = { Uniform = [50, 150] }
# Example: plant_max_energy = { Uniform = { min = 150, max = 250 } }

[cell] # New section for cell configuration
# Minimum energy a cell must have to exist. This energy is dropped when the cell dies.
min_energy = 10

# Initial energy for newly created cells (both at game start and from splits, before parent transfers energy for split).
initial_energy = 100

# Number of cells each team starts with.
starting_cells_per_team = 5

# New: Absolute maximum energy a cell can hold
max_energy = 500

# New: Min power for an attack (at 0 energy or below scaling threshold)
min_attack_power = 5

# New: Max power for an attack (at or above scaling_energy)
max_attack_power = 50

# New: Energy level at which max_attack_power is achieved
max_energy_for_attack_scaling = 200 