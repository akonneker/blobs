name: Full conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: full-conformance-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  language-and-runtime-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.3.0"
          cache: npm
          cache-dependency-path: minds/assemblyscript_wait_mind/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.1"
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.41.1"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes capnproto libvulkan1 mesa-vulkan-drivers
      - run: scripts/conformance.sh
